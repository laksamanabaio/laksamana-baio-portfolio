<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17252f">
<title>Laksamana Baio | Interactive Portfolio Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111c25;color:#f5e9d7;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,1000px)}header{margin-bottom:18px}h1{font-size:clamp(1.4rem,3vw,2.1rem);margin:0 0 6px}p{margin:0;color:#bbcad0}#game{width:100%;aspect-ratio:16/9;border:3px solid #4b6975;border-radius:8px;overflow:hidden;background:#263b46}#game canvas{display:block;width:100%;height:100%;image-rendering:pixelated}footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:14px;font-size:.9rem;color:#bbcad0}.touch{display:flex;gap:6px;justify-content:center;margin-top:14px}.touch button{width:56px;height:48px;background:#344d5a;color:#fff;border:1px solid #6c8b98;border-radius:8px;font-size:20px;touch-action:none}.touch button:active{background:#638b99}@media (pointer:fine){.touch{display:none}}
</style>
</head>
<body>
<main>
<header><h1>Laksamana Baio</h1><p>Interactive portfolio · First playable prototype</p></header>
<div id="game" role="application" aria-label="2D exploration game. Move with WASD or arrow keys."></div>
<div class="touch" aria-label="Touch movement controls"><button data-dir="left" aria-label="Left">←</button><button data-dir="up" aria-label="Up">↑</button><button data-dir="down" aria-label="Down">↓</button><button data-dir="right" aria-label="Right">→</button></div>
<footer><span>Move: WASD / Arrow Keys · Touch buttons on mobile</span><span>Prototype 01 — placeholder graphics</span></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script>
if (!window.Phaser) {
 document.getElementById('game').textContent='Unable to load Phaser. Please check your internet connection.';
} else {
 const W=960,H=540, pressed=new Set();
 for(const button of document.querySelectorAll('[data-dir]')){
  const dir=button.dataset.dir;
  button.addEventListener('pointerdown',e=>{e.preventDefault();pressed.add(dir);button.setPointerCapture(e.pointerId)});
  for(const type of ['pointerup','pointercancel','lostpointercapture']) button.addEventListener(type,()=>pressed.delete(dir));
 }
 class Room extends Phaser.Scene{
  constructor(){super('Room')}
  create(){
   // Prototype 02: fixed architectural layer, no furniture or interactive objects.
   const g=this.add.graphics();
   const rect=(x,y,w,h,c)=>{g.fillStyle(c);g.fillRect(x,y,w,h)};
   rect(0,0,W,H,0x172b34);
   // Soft wooden floor: aligned 32px boards, deliberate pixel clusters.
   rect(48,106,864,386,0xb99b77);
   for(let y=106,row=0;y<492;y+=32,row++){
     rect(48,y,864,2,0x967b61);
     for(let x=48+(row%2)*32;x<912;x+=64){
       rect(x,y+2,2,30,0xa78a6a);
       rect(x+9,y+10,18,2,0xc5aa85);
     }
   }
   // Back wall and architectural trim.
   rect(48,32,864,76,0x637d81);
   rect(48,32,864,8,0x344f5c);
   rect(48,92,864,16,0x405c64);
   rect(48,108,864,6,0x8b725c);
   rect(32,32,16,476,0x324b55);
   rect(912,32,16,476,0x324b55);
   rect(32,492,896,16,0x324b55);
   rect(48,492,864,7,0x92785e);
   // Large permanent window, built from hard-edged pixel rectangles.
   rect(354,44,252,48,0x2a4554);
   rect(362,49,236,37,0x7ea9b2);
   rect(362,68,236,18,0x567e8d);
   rect(374,54,28,9,0xb7c9b9);
   rect(422,57,20,6,0xb7c9b9);
   rect(477,49,6,37,0x2a4554);
   rect(362,69,236,4,0x2a4554);
   rect(350,88,260,6,0x324b55);
   // Subtle, fixed architectural wall accents.
   for(const x of [86,834]){
     rect(x,51,40,6,0x415e68);
     rect(x+4,53,20,2,0x8bb5b4);
   }
   rect(48,114,864,5,0x765e4c);
   this.add.text(72,126,'STUDIO / 01',{fontFamily:'monospace',fontSize:'16px',color:'#675d4e'});
   const character=this.add.graphics();
   character.fillStyle(0x34434c);character.fillRect(-13,11,26,7);
   character.fillStyle(0x253c4b);character.fillRect(-13,-12,26,27);
   character.fillStyle(0xe5b995);character.fillRect(-10,-26,20,17);
   character.fillStyle(0x202c35);character.fillRect(-11,-30,22,9);
   character.fillStyle(0x84bdc5);character.fillRect(-9,-8,18,11);
   this.player=this.add.container(480,290,[character]);
   this.keys=this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT');
  }
  update(_,delta){
   const k=this.keys;let x=0,y=0;
   if(k.A.isDown||k.LEFT.isDown||pressed.has('left'))x--;
   if(k.D.isDown||k.RIGHT.isDown||pressed.has('right'))x++;
   if(k.W.isDown||k.UP.isDown||pressed.has('up'))y--;
   if(k.S.isDown||k.DOWN.isDown||pressed.has('down'))y++;
   if(!x&&!y)return;
   const length=Math.hypot(x,y),speed=195*Math.min(delta,50)/1000;
   this.player.x=Phaser.Math.Clamp(this.player.x+x/length*speed,74,886);
   this.player.y=Phaser.Math.Clamp(this.player.y+y/length*speed,132,465);
  }
 }
 new Phaser.Game({type:Phaser.AUTO,parent:'game',width:W,height:H,backgroundColor:'#263b46',pixelArt:true,render:{pixelArt:true,antialias:false},scene:[Room],scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH}});
}
</script>
</body></html>
