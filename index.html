<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17252f">
<title>Laksamana Baio | Interactive Portfolio Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111c25;color:#f5e9d7;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,1000px)}header{margin-bottom:18px}h1{font-size:clamp(1.4rem,3vw,2.1rem);margin:0 0 6px}p{margin:0;color:#bbcad0}#game{width:100%;aspect-ratio:16/9;border:3px solid #4b6975;border-radius:8px;overflow:hidden;background:#263b46}#game canvas{display:block;width:100%;height:100%;image-rendering:pixelated}footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:14px;font-size:.9rem;color:#bbcad0}.touch{display:flex;gap:6px;justify-content:center;margin-top:14px}.touch button{width:56px;height:48px;background:#344d5a;color:#fff;border:1px solid #6c8b98;border-radius:8px;font-size:20px;touch-action:none}.touch button:active{background:#638b99}@media (pointer:fine){.touch{display:none}}
</style>
</head>
<body>
<main>
<header><h1>Laksamana Baio</h1><p>Interactive portfolio · Walkable District 2077</p></header>
<div id="game" role="application" aria-label="2D exploration game. Move with WASD or arrow keys."></div>
<div class="touch" aria-label="Touch movement controls"><button data-dir="left" aria-label="Left">←</button><button data-dir="up" aria-label="Up">↑</button><button data-dir="down" aria-label="Down">↓</button><button data-dir="right" aria-label="Right">→</button></div>
<footer><span>Move: WASD / Arrow Keys · Touch buttons on mobile</span><span>Prototype 06 — 2077 building facade study</span></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script>
if (!window.Phaser) {
 document.getElementById('game').textContent='Unable to load Phaser. Please check your internet connection.';
} else {

 const W=960,H=540,pressed=new Set();
 for(const button of document.querySelectorAll('[data-dir]')){
  const dir=button.dataset.dir;
  button.addEventListener('pointerdown',e=>{e.preventDefault();pressed.add(dir);button.setPointerCapture(e.pointerId)});
  for(const type of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(type,()=>pressed.delete(dir));
 }
 const destinations={
  home:{name:'HOME',sub:'About Me',color:0x537b82},
  lab:{name:'LABORATORY',sub:'Experience',color:0x467f87},
  workshop:{name:'WORKSHOP',sub:'Projects',color:0x986d52},
  hub:{name:'CONTACT HUB',sub:'Contact',color:0x6d6b96}
 };
 class World extends Phaser.Scene{
  constructor(){super('World')}
  init(data){this.place=data.place||'home';this.spawn=data.spawn||null;this.changing=false}
  create(){
   const g=this.add.graphics(),rect=(x,y,w,h,c)=>{g.fillStyle(c);g.fillRect(x,y,w,h)};
   rect(0,0,W,H,0x142733);
   if(this.place==='district'){
    this.worldW=1920;this.worldH=1260;
    this.buildings=[{id:'home',x:170,y:180,w:190,h:158},{id:'lab',x:1150,y:155,w:204,h:168},{id:'workshop',x:1230,y:850,w:210,h:168},{id:'hub',x:240,y:850,w:200,h:168}];
    rect(0,0,this.worldW,this.worldH,0x1b3540);
    for(let x=0;x<this.worldW;x+=80)for(let y=0;y<this.worldH;y+=80){rect(x+4,y+4,70,70,0x24434e);rect(x+12,y+12,4,4,0x31535e)}
    rect(0,350,this.worldW,180,0x53636c);rect(0,710,this.worldW,180,0x53636c);
    rect(440,0,200,this.worldH,0x53636c);rect(1000,0,200,this.worldH,0x53636c);
    rect(0,1060,this.worldW,130,0x53636c);
    for(const y of [340,530,700,890,1050,1190])rect(0,y,this.worldW,9,0x81a2a1);
    for(let x=20;x<this.worldW;x+=84){rect(x,437,45,5,0xb5b6a1);rect(x,797,45,5,0xb5b6a1)}
    for(let y=30;y<this.worldH;y+=54){rect(533,y,5,28,0xb5b6a1);rect(1093,y,5,28,0xb5b6a1)}
    this.zones=[];
    for(const b of this.buildings){
     const themes={
      home:{base:0x514a46,trim:0xcba675,glass:0xb9a37e,roof:0x343e46,sign:'HOME'},
      lab:{base:0x294e5c,trim:0x6bd2d1,glass:0x5aafb9,roof:0x253947,sign:'LABORATORY'},
      workshop:{base:0x5a483a,trim:0xe3a254,glass:0xc58b4c,roof:0x34383c,sign:'WORKSHOP'},
      hub:{base:0x423b60,trim:0xb18af0,glass:0x8a6ab7,roof:0x302e48,sign:'CONTACT HUB'}
     };
     const t=themes[b.id],cx=b.x+b.w/2,dy=b.y+b.h;
     // Layered roof and walls, drawn in hard-edged pixel geometry.
     rect(b.x+13,b.y+18,b.w,b.h,0x102732);
     rect(b.x,b.y+22,b.w,b.h-22,t.base);
     rect(b.x-12,b.y+10,b.w+24,22,t.roof);
     rect(b.x-7,b.y+3,b.w+14,14,0x182c39);
     rect(b.x+8,b.y+34,b.w-16,8,t.trim);
     rect(b.x+14,b.y+46,b.w-28,47,t.roof);
     for(let j=0;j<4;j++){
      const wx=b.x+22+j*(b.w-44)/4;
      rect(wx,b.y+51,(b.w-64)/4,34,t.glass);
      rect(wx+3,b.y+54,(b.w-80)/4,4,0xb3e1d6);
      rect(wx+3,b.y+64,3,18,0x2b5361);
     }
     rect(b.x+12,b.y+105,b.w-24,6,t.trim);
     // Distinctive rooftop details.
     if(b.id==='home'){
      rect(b.x+23,b.y-9,36,18,0x3c4548);rect(b.x+29,b.y-16,24,7,0x8d7562);
      rect(b.x+b.w-65,b.y-7,43,16,0x46535a);
     }else if(b.id==='lab'){
      rect(b.x+27,b.y-12,56,19,0x264e5d);rect(b.x+34,b.y-7,42,7,0x70c9c7);
      rect(b.x+b.w-57,b.y-18,27,27,0x294b58);
     }else if(b.id==='workshop'){
      rect(b.x+23,b.y-14,52,24,0x3b4143);rect(b.x+30,b.y-9,38,6,0xc38848);
      rect(b.x+b.w-62,b.y-22,18,32,0x3c4144);
     }else{
      rect(cx-7,b.y-29,14,39,0x4a4970);rect(cx-18,b.y-32,36,7,0xb18af0);
      rect(b.x+24,b.y-8,25,17,0x554878);
     }
     // Door sized against the unchanged character sprite.
     rect(cx-30,dy-58,60,58,0x132b38);
     rect(cx-22,dy-50,44,50,t.glass);
     rect(cx-22,dy-50,44,6,t.trim);
     rect(cx-3,dy-42,6,42,0x254657);
     rect(cx-36,dy-3,72,7,0xcab18b);
     this.add.text(cx,b.y+114,t.sign,{fontFamily:'monospace',fontSize:'15px',color:'#fff0d7',backgroundColor:'#172d3a',padding:{x:8,y:4}}).setOrigin(.5,0);
     // Entrance remains directly below the building, outside its collision.
     this.zones.push({x:cx,y:dy+32,r:65,label:'Enter '+destinations[b.id].name,to:b.id});
    }
    for(const [x,y] of [[750,250],[850,1030],[1570,580],[120,630],[1660,1060]]){
     rect(x,y,74,54,0x294b57);rect(x+8,y+8,58,28,0x397080);rect(x+14,y+13,46,4,0x87c3bc);
    }
    this.add.text(860,625,'BAIO DISTRICT  //  SECTOR 2077',{fontFamily:'monospace',fontSize:'23px',color:'#9cc6c4'}).setOrigin(.5);
    this.minimap=this.add.graphics().setScrollFactor(0).setDepth(100);
    this.add.text(24,373,'DISTRICT MAP',{fontFamily:'monospace',fontSize:'12px',color:'#c4e3df'}).setScrollFactor(0).setDepth(101);
    this.cameras.main.setBounds(0,0,this.worldW,this.worldH);
   }else{
    rect(40,35,880,470,0x344d59);rect(56,98,848,388,0xb59a79);
    for(let y=98;y<486;y+=32){rect(56,y,848,2,0x947b61);for(let x=56+(y%64?32:0);x<904;x+=64)rect(x,y+2,2,30,0xa98b6d)}
    rect(56,40,848,58,destinations[this.place].color);
    rect(340,48,280,38,0x284c5c);rect(349,55,262,24,0x7ca8b2);
    rect(40,35,16,470,0x203743);rect(904,35,16,470,0x203743);
    rect(56,486,848,19,0x354d59);
    rect(439,469,82,36,0x223b47);rect(449,475,62,25,0x80a9b0);
    this.add.text(480,118,destinations[this.place].name+' / '+destinations[this.place].sub,{fontFamily:'monospace',fontSize:'20px',color:'#584d43'}).setOrigin(.5,0);
    this.add.text(480,434,'EXIT TO DISTRICT',{fontFamily:'monospace',fontSize:'14px',color:'#584d43'}).setOrigin(.5);
    this.zones=[{x:480,y:452,r:68,label:'Exit to District',to:'district'}];
    if(this.place==='workshop'){
     // Return portal: paired with the Laboratory workstation portal.
     rect(220,195,120,56,0x345d6c);
     rect(235,203,90,34,0x70a9b4);
     this.add.text(280,205,'LAB PORTAL',{fontFamily:'monospace',fontSize:'12px',color:'#173542'}).setOrigin(.5);
     this.zones.push({x:280,y:282,r:70,label:'Return to Laboratory',to:'lab'});
    }
    if(this.place==='lab'){
     rect(220,195,120,56,0x345d6c);rect(620,195,120,56,0x345d6c);
     this.zones.push({x:280,y:282,r:70,label:'View project in Workshop',to:'workshop'});
     this.add.text(280,205,'WORKSTATION',{fontFamily:'monospace',fontSize:'12px',color:'#e2e8df'}).setOrigin(.5);
    }
   }
   const cg=this.add.graphics();
   cg.fillStyle(0x223744);cg.fillRect(-13,-11,26,28);
   cg.fillStyle(0xe0b68e);cg.fillRect(-10,-27,20,17);
   cg.fillStyle(0x1d303a);cg.fillRect(-11,-30,22,9);
   cg.fillStyle(0x88bdc5);cg.fillRect(-9,-6,18,10);
   cg.fillStyle(0x263640);cg.fillRect(-11,15,8,6);cg.fillRect(3,15,8,6);
   const pos=this.spawn||(this.place==='district'?{x:265,y:410}:{x:480,y:340});
   this.player=this.add.container(pos.x,pos.y,[cg]);
   if(this.place==='district')this.cameras.main.startFollow(this.player,true,0.12,0.12);
   this.keys=this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT,E,SPACE');
   this.prompt=this.add.text(480,516,'',{fontFamily:'monospace',fontSize:'17px',color:'#fff2d4',backgroundColor:'#1c3442',padding:{x:12,y:6}}).setOrigin(.5).setScrollFactor(0).setDepth(102);
   this.near=null;
   this.input.keyboard.on('keydown-E',()=>this.interact());
   this.input.keyboard.on('keydown-SPACE',()=>this.interact());
   this.input.on('pointerdown',()=>{if(this.near)this.interact()});
  }
  interact(){
   if(!this.near||this.changing)return;
   this.changing=true;
   const to=this.near.to;
   const exits={home:{x:265,y:410},lab:{x:1252,y:397},workshop:{x:1335,y:1090},hub:{x:340,y:1090}};
   const spawn=to==='district'
    ? (exits[this.place]||exits.home)
    : this.place==='district'
      ? {x:480,y:388}
      : {x:480,y:340};
   this.cameras.main.fadeOut(240,0,0,0);
   this.cameras.main.once('camerafadeoutcomplete',()=>{
    this.scene.restart({place:to,spawn});
   });
  }
  update(_,delta){
   const k=this.keys;let x=0,y=0;
   if(k.A.isDown||k.LEFT.isDown||pressed.has('left'))x--;
   if(k.D.isDown||k.RIGHT.isDown||pressed.has('right'))x++;
   if(k.W.isDown||k.UP.isDown||pressed.has('up'))y--;
   if(k.S.isDown||k.DOWN.isDown||pressed.has('down'))y++;
   if(x||y){
    const length=Math.hypot(x,y),speed=195*Math.min(delta,50)/1000;
    const minY=this.place==='district'?35:143,maxY=this.place==='district'?this.worldH-35:466;
    const nextX=Phaser.Math.Clamp(this.player.x+x/length*speed,35,this.place==='district'?this.worldW-35:890);
    const nextY=Phaser.Math.Clamp(this.player.y+y/length*speed,minY,maxY);
    if(this.place==='district'){
     // Collision footprint: character feet cannot enter building walls/roofs.
     const blocked=(px,py)=>this.buildings.some(b=>
      px>b.x-14&&px<b.x+b.w+14&&py>b.y-18&&py<b.y+b.h+9);
     if(!blocked(nextX,this.player.y))this.player.x=nextX;
     if(!blocked(this.player.x,nextY))this.player.y=nextY;
    }else{this.player.x=nextX;this.player.y=nextY;}
   }
   this.near=this.zones.find(z=>Math.hypot(this.player.x-z.x,this.player.y-z.y)<z.r)||null;
   this.prompt.setText(this.near?'[E / TAP] '+this.near.label:'WASD / ARROWS TO MOVE');
   if(this.place==='district'){
    const m=this.minimap,mx=18,my=388,mw=188,mh=124,sx=mw/this.worldW,sy=mh/this.worldH;
    m.clear();m.fillStyle(0x0b202c,0.93);m.fillRect(mx-5,my-23,mw+10,mh+28);
    m.lineStyle(2,0x6aa6a8);m.strokeRect(mx-5,my-23,mw+10,mh+28);
    m.fillStyle(0x4b6470);
    m.fillRect(mx,my+350*sy,mw,180*sy);m.fillRect(mx,my+710*sy,mw,180*sy);
    m.fillRect(mx+440*sx,my+350*sy,200*sx,540*sy);
    m.fillRect(mx+1000*sx,my+350*sy,200*sx,540*sy);
    for(const b of this.buildings){m.fillStyle(destinations[b.id].color);m.fillRect(mx+b.x*sx,my+b.y*sy,Math.max(7,b.w*sx),Math.max(7,b.h*sy))}
    m.fillStyle(0xffdf88);m.fillCircle(mx+this.player.x*sx,my+this.player.y*sy,4);
   }
  }
 }
 new Phaser.Game({type:Phaser.AUTO,parent:'game',width:W,height:H,backgroundColor:'#142733',pixelArt:true,render:{pixelArt:true,antialias:false},scene:[World],scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH}});
}

</script>
</body></html>
